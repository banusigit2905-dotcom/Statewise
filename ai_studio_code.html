<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatWise - Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library untuk membaca Excel (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>StatWise <span>📊</span></h1>
            <p>Kelola e-Statement Anda dengan mudah dan aman.</p>
        </header>

        <!-- Bagian Upload -->
        <section class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
                <label for="fileInput" class="btn-primary">Pilih File (CSV / XLSX)</label>
            </div>
            <button id="clearData" class="btn-danger">Hapus Semua Data</button>
        </section>

        <!-- Ringkasan Statistik -->
        <section class="summary-cards">
            <div class="card income">
                <h3>Total Pemasukan</h3>
                <p id="totalIncome">Rp 0</p>
            </div>
            <div class="card expense">
                <h3>Total Pengeluaran</h3>
                <p id="totalExpense">Rp 0</p>
            </div>
            <div class="card balance">
                <h3>Saldo Akhir</h3>
                <p id="totalBalance">Rp 0</p>
            </div>
        </section>

        <!-- Tabel Transaksi -->
        <section class="table-container">
            <table id="transactionTable">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Deskripsi</th>
                        <th>Debit (Keluar)</th>
                        <th>Kredit (Masuk)</th>
                        <th>Kategori</th>
                        <th>Catatan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan muncul di sini -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
